[project]
name = "zwoproxy"
version = "0.1.1"
description = "Host tooling for ZWO-EAF-Proxy: EAF capture decoding and protocol modelling"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cynthion>=0.2.5",
    "facedancer>=3.1.3",
    "libusb1>=3.1",  # talks to the Cynthion analyzer; already a cynthion dependency
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
zwoproxy = "zwoproxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zwoproxy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
